name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ogserc
          POSTGRES_PASSWORD: ogserc
          POSTGRES_DB: ogserc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ogserc"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://ogserc:ogserc@localhost:5432/ogserc_test
      DATABASE_URL: postgres://ogserc:ogserc@localhost:5432/ogserc_test
      DATABASE_URL_UNPOOLED: postgres://ogserc:ogserc@localhost:5432/ogserc_test
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests (PostgreSQL)
        run: pnpm test:integration
      - name: Build
        run: pnpm build
