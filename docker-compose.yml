# Local PostgreSQL for development and integration tests.
# Port 5433 avoids clashing with any Postgres already on 5432.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ogserc
      POSTGRES_PASSWORD: ogserc
      POSTGRES_DB: ogserc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogserc"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
